name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build workspaces
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Validate changeset scope
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: yarn check:changeset "origin/${{ github.base_ref }}" HEAD

      - name: Enforce release-only production PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_BRANCH" != "develop" && ! "$HEAD_BRANCH" =~ ^release/(web|backoffice)/[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Pull requests to main must be the develop promotion or release/<app>/<version>."
            exit 1
          fi
