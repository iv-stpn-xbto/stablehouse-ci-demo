name: Promote develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted develop automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false

      - name: Open or update the promote PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: node scripts/promote.mjs
