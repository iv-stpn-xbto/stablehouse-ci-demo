name: Backmerge production

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: backmerge-main-to-develop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  complete-release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.complete.outputs.app }}
      version: ${{ steps.complete.outputs.version }}
      tag: ${{ steps.complete.outputs.tag }}
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Tag app release and delete ephemeral branch
        id: complete
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: node scripts/complete-release.mjs

  record-web-deployment:
    needs: complete-release
    if: needs.complete-release.outputs.app == 'web'
    runs-on: ubuntu-latest
    environment: production-web
    steps:
      - run: echo "Recorded ${{ needs.complete-release.outputs.tag }} as the web deployment."

  record-backoffice-deployment:
    needs: complete-release
    if: needs.complete-release.outputs.app == 'backoffice'
    runs-on: ubuntu-latest
    environment: production-backoffice
    steps:
      - run: echo "Recorded ${{ needs.complete-release.outputs.tag }} as the backoffice deployment."

  backmerge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      MERGED_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Create or update main to develop backmerge
        id: backmerge
        run: |
          ahead_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/develop...main" --jq '.ahead_by')"
          if [[ "$ahead_by" == "0" ]]; then
            echo "main is already contained in develop."
            exit 0
          fi

          backmerge_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [[ -z "$backmerge_url" ]]; then
            backmerge_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head main \
              --title "Backmerge main into develop" \
              --body "Automated backmerge after main PR #${MERGED_PR}. This PR carries promotion/release merge commits and version updates back to develop.")"
          fi

          echo "url=$backmerge_url" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge when conflict-free
        if: steps.backmerge.outputs.url != ''
        env:
          BACKMERGE_URL: ${{ steps.backmerge.outputs.url }}
        run: |
          if ! gh pr merge "$BACKMERGE_URL" --merge --auto; then
            echo "::warning::Automatic merge is unavailable. The backmerge PR remains open for a human to resolve or merge."
          fi
