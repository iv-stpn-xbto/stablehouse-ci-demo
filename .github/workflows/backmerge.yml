name: Complete release and backmerge

on:
  pull_request:
    branches: [main]
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backmerge-main-to-develop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  complete-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.complete.outputs.version }}
      tag: ${{ steps.complete.outputs.tag }}
      kind: ${{ steps.complete.outputs.kind }}
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Tag release and delete ephemeral branch
        id: complete
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: node scripts/complete-release.mjs

  record-deployment:
    needs: complete-release
    if: needs.complete-release.result == 'success'
    runs-on: ubuntu-latest
    environment: production-web
    steps:
      - run: echo "Recorded ${{ needs.complete-release.outputs.tag }} as the web deployment."

  backmerge:
    needs: [complete-release]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create or rebase backmerge/X.X.X
        id: backmerge
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: node scripts/prepare-backmerge.mjs
